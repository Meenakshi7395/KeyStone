spring.application.name=DeliveryService

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/keystone}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:keystone}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:keystone}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is managed by Hibernate for now (Flyway can be added later).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Set JWT_SECRET in the environment (at least 32 characters). The fallback is for local dev only.
JWT_SECRET=${JWT_SECRET:change-this-secret-in-production-please-32chars}
JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:3600000}

# Front-end origins allowed to call the API (comma-separated).
keystone.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3003,http://localhost:5173,http://localhost:5174}

# Seed demo logins (one per role) and sample data on startup. Safe to leave on.
keystone.seed.enabled=${SEED_DATA:true}
# SLA monitor: how often to scan for at-risk / breached work orders.
keystone.sla.check-interval-ms=${SLA_CHECK_INTERVAL_MS:300000}
keystone.sla.initial-delay-ms=${SLA_INITIAL_DELAY_MS:30000}

# Paging guard-rail: never return unbounded result sets.
spring.data.web.pageable.max-page-size=1000

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.com.KeyStone.DeliveryService=INFO

server.port=${PORT:8080}